; PlatformIO Project Configuration File for ESP32 WROOM-32D DevKit
; Smart KWH Meter PZEM-004T v3.0 with HTTPS Batch Telemetry

[env:esp32dev]
platform = espressif32 @ ~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

build_flags = 
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_HAS_PSRAM=0

lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    mandulaj/PZEM-004T-v30 @ ^1.1.2
